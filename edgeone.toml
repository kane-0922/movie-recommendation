# EdgeOne Pages 配置文件
# 文档：https://pages.edgeone.ai/document/edgeone-toml

[build]
command = "npm run build"
publish = "dist"

# 静态资源直通（JS / CSS / 图片），不做 SPA fallback
[[redirects]]
from = "/assets/*"
to = "/assets/:splat"
status = 200

# SPA fallback：其余路径回退到 index.html
# /api/* 由 functions/ 目录自动路由，无需在此声明
# BrowserRouter (HTML5 History) 需要此配置才能正确处理 /movie/:id、/mylist 等路由
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
